name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .prototools

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: HTTP E2E tests (no infra needed)
        run: bun run test:e2e:http

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .prototools

      - name: Install dependencies
        run: bun install

      - name: Start infrastructure
        run: bun run infra:up

      - name: Wait for services
        run: |
          echo "Waiting for MinIO..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 15); do
            docker compose -f infra/docker-compose.yml exec -T redis redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          echo "Services ready."

      - name: Run all E2E tests
        run: bun run test:e2e
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          REDIS_URL: redis://localhost:6379

      - name: Stop infrastructure
        if: always()
        run: bun run infra:down
